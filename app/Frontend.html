<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    
    <div class="card shadow mb-4" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-primary text-white text-center">
            <h4>Thêm Nhân Viên Mới</h4>
        </div>
        <div class="card-body">
            <form id="formNhanVien">
                <div class="mb-3">
                    <label for="hoTen" class="form-label fw-bold">Họ và tên</label>
                    <input type="text" class="form-control" id="hoTen" placeholder="Nhập họ và tên..." required>
                </div>
                
                <div class="mb-3">
                    <label for="soDienThoai" class="form-label fw-bold">Số điện thoại</label>
                    <input type="tel" class="form-control" id="soDienThoai" placeholder="Nhập số điện thoại..." required>
                </div>

                <div class="mb-3">
                    <label for="ngayVaoLam" class="form-label fw-bold">Ngày vào làm</label>
                    <input type="date" class="form-control" id="ngayVaoLam" required>
                </div>

                <div class="mb-3">
                    <label for="caLamViec" class="form-label fw-bold">Ca làm việc</label>
                    <select class="form-select" id="caLamViec" required>
                        <option value="" selected disabled>-- Chọn ca làm việc --</option>
                        <option value="Sáng">Ca Sáng</option>
                        <option value="Tối">Ca Tối</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="mucLuong" class="form-label fw-bold">Mức lương theo giờ (VNĐ)</label>
                    <input type="number" class="form-control" id="mucLuong" placeholder="Ví dụ: 25000" required>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold" id="btnThem">
                    Thêm nhân viên
                </button>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Danh Sách Nhân Viên</h5>
        </div>
        <div class="card-body p-0 table-responsive">
            <table class="table table-bordered table-hover mb-0 text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th>STT</th>
                        <th>Họ Tên</th>
                        <th>Số điện thoại</th>
                        <th>Ngày vào làm</th>
                        <th>Ca làm</th>
                        <th>Lương/giờ</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
