<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow mb-5" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-primary text-white text-center">
            <h4>Thêm Nhân Viên Mới</h4>
        </div>
        <div class="card-body">
            <form id="formNhanVien">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Họ và tên (name)</label>
                    <input type="text" class="form-control" id="name" placeholder="Nhập họ tên...">
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label fw-bold">Ca làm / Chức vụ (role)</label>
                    <input type="text" class="form-control" id="role" placeholder="Ví dụ: Ca Sáng, Quản lý...">
                </div>
                <div class="mb-3">
                    <label for="hourly_rate" class="form-label fw-bold">Mức lương/giờ (hourly_rate)</label>
                    <input type="number" class="form-control" id="hourly_rate" placeholder="Ví dụ: 50000">
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Lưu Nhân Viên</button>
            </form>
        </div>
    </div>

    <div class="card shadow border-0">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0 fw-bold"><i class="bi bi-table"></i> Danh Sách Nhân Viên Bán Hàng</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-bordered mb-0 align-middle">
                    <thead class="table-secondary">
                        <tr>
                            <th scope="col" class="text-center" style="width: 5%;">STT</th>
                            <th scope="col" style="width: 25%;">Mã ID (MongoDB)</th>
                            <th scope="col" style="width: 25%;">Họ và tên</th>
                            <th scope="col" style="width: 15%;">Chức vụ / Ca</th>
                            <th scope="col" style="width: 15%;">Lương/Giờ</th>
                            <th scope="col" class="text-center" style="width: 15%;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
