<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Viên Bán Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary fw-bold">🚀 Hệ Thống Quản Lý Nhân Viên Bán Hàng</h2>
            <span class="badge bg-success px-3 py-2">Phase 1: Completed</span>
        </div>

        <div class="card shadow-sm border-0 mb-5">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="card-title mb-0"><i class="bi bi-person-plus-fill"></i> Thêm Nhân Viên Mới</h5>
            </div>
            <div class="card-body p-4">
                <form id="employeeForm">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="name" class="form-label fw-bold">Họ và tên (name)</label>
                            <input type="text" class="form-control" id="name" placeholder="Ví dụ: Nguyễn Văn Bắc" required>
                        </div>
                        
                        <div class="col-md-4">
                            <label for="role" class="form-label fw-bold">Ca làm / Chức vụ (role)</label>
                            <select class="form-select" id="role" required>
                                <option value="" selected disabled>Chọn ca làm...</option>
                                <option value="Ca Sáng">Ca Sáng (6h - 12h)</option>
                                <option value="Ca Chiều">Ca Chiều (12h - 18h)</option>
                                <option value="Ca Tối">Ca Tối (18h - 22h)</option>
                            </select>
                        </div>
                        
                        <div class="col-md-3">
                            <label for="hourly_rate" class="form-label fw-bold">Lương/Giờ (hourly_rate)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="hourly_rate" placeholder="45000" required>
                                <span class="input-group-text">đ/h</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 text-end">
                        <button type="reset" class="btn btn-secondary me-2"><i class="bi bi-arrow-counterclockwise"></i> Nhập lại</button>
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle"></i> Thêm Nhân Viên</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="card-title mb-0"><i class="bi bi-list-stars"></i> Danh Sách Nhân Viên Hiện Có</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-bordered mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" class="text-center" style="width: 5%;">STT</th>
                                <th scope="col" style="width: 25%;">Mã ID (MongoDB)</th>
                                <th scope="col" style="width: 30%;">Họ và tên (name)</th>
                                <th scope="col" style="width: 15%;">Ca làm / Chức vụ (role)</th>
                                <th scope="col" style="width: 13%;">Lương/Giờ (hourly_rate)</th>
                                <th scope="col" class="text-center" style="width: 12%;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <tr>
                                <td class="text-center">1</td>
                                <td class="text-muted font-monospace" style="font-size: 0.85rem;">65b2c1a8e4b0f32a1c000001</td>
                                <td class="fw-bold text-secondary">Nguyễn Văn Khương</td>
                                <td><span class="badge bg-info text-dark">Ca Sáng</span></td>
                                <td class="text-end fw-semibold">50,000 đ</td>
                                <td class="text-center">
                                    <button class="btn btn-warning btn-sm me-1 text-dark" title="Sửa"><i class="bi bi-pencil-square"></i> Sửa</button>
                                    <button class="btn btn-danger btn-sm" title="Xóa"><i class="bi bi-trash"></i> Xóa</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
