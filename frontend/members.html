<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh sách Nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Danh Sách Nhân Viên Bán Hàng</h2>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-bordered mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" class="text-center" style="width: 5%;">STT</th>
                            <th scope="col" style="width: 25%;">Mã ID (MongoDB)</th>
                            <th scope="col" style="width: 25%;">Họ và tên (name)</th>
                            <th scope="col" style="width: 15%;">Ca làm / Chức vụ (role)</th>
                            <th scope="col" style="width: 15%;">Lương/Giờ (hourly_rate)</th>
                            <th scope="col" class="text-center" style="width: 15%;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="text-center">1</td>
                            <td class="text-muted font-monospace" style="font-size: 0.85rem;">65b2c1a8e4b0f32a1c000001</td>
                            <td class="fw-bold text-secondary">Nguyễn Văn Khương</td>
                            <td><span class="badge bg-info text-dark">Ca Sáng</span></td>
                            <td class="text-end fw-semibold">50,000 đ</td>
                            <td class="text-center">
                                <button class="btn btn-warning btn-sm me-1 text-dark" title="Sửa"><i class="bi bi-pencil-square"></i> Sửa</button>
                                <button class="btn btn-danger btn-sm" title="Xóa"><i class="bi bi-trash"></i> Xóa</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="text-center">2</td>
                            <td class="text-muted font-monospace" style="font-size: 0.85rem;">65b2c21fe4b0f32a1c000002</td>
                            <td class="fw-bold text-secondary">Trần Thị B</td>
                            <td><span class="badge bg-warning text-dark">Ca Chiều</span></td>
                            <td class="text-end fw-semibold">45,000 đ</td>
                            <td class="text-center">
                                <button class="btn btn-warning btn-sm me-1 text-dark" title="Sửa"><i class="bi bi-pencil-square"></i> Sửa</button>
                                <button class="btn btn-danger btn-sm" title="Xóa"><i class="bi bi-trash"></i> Xóa</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
